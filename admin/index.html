<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin - Virgina Decoration</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f5f4f0; }
    h1 { color: #123524; }
    h2 { color: #123524; border-bottom: 2px solid #c9a97a; padding-bottom: 0.4rem; margin-top: 2.5rem; }
    .btn { background: #123524; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    .btn:hover { background: #1c5236; }
    .btn-danger { background: #b3261e; }
    .btn-danger:hover { background: #8c1d17; }
    .card { background: #fff; border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .card img, .card video { width: 90px; height: 70px; object-fit: cover; border-radius: 6px; }
    .card-info { flex: 1; }
    .empty { color: #777; font-style: italic; }
    input, select { padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; margin-right: 0.5rem; }
    .unread { border-left: 4px solid #c9a97a; }
</style>
</head>
<body>

<h1>Panneau d'administration - Virgina Decoration</h1>

<h2>Ajouter une réalisation</h2>
<button class="btn" id="upload-btn">Choisir une photo ou vidéo</button>
<div id="upload-form" style="display:none; margin-top:1rem;">
    <input type="text" id="new-title" placeholder="Titre (optionnel)">
    <input type="number" id="new-order" placeholder="Ordre d'affichage" value="0" style="width:120px;">
    <button class="btn" id="save-btn">Enregistrer dans la galerie</button>
</div>

<h2>Galerie actuelle</h2>
<div id="gallery-list"><p class="empty">Chargement...</p></div>

<h2>Messages reçus</h2>
<div id="messages-list"><p class="empty">Chargement...</p></div>

<script>
    // Ces deux valeurs sont publiques (nécessaires côté navigateur pour un upload "unsigned")
    var CLOUDINARY_CLOUD_NAME = "REMPLACER_PAR_TON_CLOUD_NAME";
    var CLOUDINARY_UPLOAD_PRESET = "REMPLACER_PAR_TON_UPLOAD_PRESET";

    var pendingUpload = null; // { url, type }

    var widget = cloudinary.createUploadWidget({
        cloudName: CLOUDINARY_CLOUD_NAME,
        uploadPreset: CLOUDINARY_UPLOAD_PRESET,
        resourceType: 'auto', // laisse Cloudinary détecter image ou vidéo
        multiple: false
    }, function (error, result) {
        if (!error && result && result.event === 'success') {
            pendingUpload = {
                url: result.info.secure_url,
                type: result.info.resource_type === 'video' ? 'video' : 'image'
            };
            document.getElementById('upload-form').style.display = 'block';
        }
    });

    document.getElementById('upload-btn').addEventListener('click', function () {
        widget.open();
    });

    document.getElementById('save-btn').addEventListener('click', function () {
        if (!pendingUpload) return;
        fetch('/api/gallery', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: document.getElementById('new-title').value,
                media_url: pendingUpload.url,
                media_type: pendingUpload.type,
                display_order: parseInt(document.getElementById('new-order').value, 10) || 0
            })
        }).then(function (res) {
            if (!res.ok) throw new Error('Échec de l\'enregistrement');
            document.getElementById('upload-form').style.display = 'none';
            document.getElementById('new-title').value = '';
            pendingUpload = null;
            loadGallery();
        }).catch(function (err) {
            alert(err.message);
        });
    });

    function loadGallery() {
        fetch('/api/gallery').then(function (res) { return res.json(); }).then(function (items) {
            var container = document.getElementById('gallery-list');
            if (!items.length) {
                container.innerHTML = '<p class="empty">Aucune réalisation pour le moment.</p>';
                return;
            }
            container.innerHTML = '';
            items.forEach(function (item) {
                var card = document.createElement('div');
                card.className = 'card';
                var mediaTag = item.media_type === 'video'
                    ? '<video src="' + item.media_url + '" muted></video>'
                    : '<img src="' + item.media_url + '" alt="">';
                card.innerHTML = mediaTag +
                    '<div class="card-info"><strong>' + (item.title || '(sans titre)') + '</strong><br><small>' + item.media_type + '</small></div>' +
                    '<button class="btn btn-danger" data-id="' + item.id + '">Supprimer</button>';
                card.querySelector('button').addEventListener('click', function () {
                    if (!confirm('Supprimer cette réalisation ?')) return;
                    fetch('/api/gallery/' + item.id, { method: 'DELETE' }).then(loadGallery);
                });
                container.appendChild(card);
            });
        });
    }

    function loadMessages() {
        fetch('/api/messages').then(function (res) { return res.json(); }).then(function (msgs) {
            var container = document.getElementById('messages-list');
            if (!msgs.length) {
                container.innerHTML = '<p class="empty">Aucun message reçu pour le moment.</p>';
                return;
            }
            container.innerHTML = '';
            msgs.forEach(function (msg) {
                var card = document.createElement('div');
                card.className = 'card';
                var date = new Date(msg.created_at).toLocaleString('fr-FR');
                card.innerHTML =
                    '<div class="card-info"><strong>' + msg.name + '</strong> — ' + msg.email + ' — ' + msg.phone +
                    '<br><small>' + date + '</small><p>' + msg.message + '</p></div>' +
                    '<button class="btn btn-danger" data-id="' + msg.id + '">Supprimer</button>';
                card.querySelector('button').addEventListener('click', function () {
                    if (!confirm('Supprimer ce message ?')) return;
                    fetch('/api/messages/' + msg.id, { method: 'DELETE' }).then(loadMessages);
                });
                container.appendChild(card);
            });
        });
    }

    loadGallery();
    loadMessages();
</script>
</body>
</html>
